execution:
  adapter: ralphex

roles:
  architect:
    provider: google
    # Vertex AI partner model (Anthropic on Vertex)
    model:
      - claude-opus-4-6
    temperature: 0.3
    max_tokens: 8192
    timeout_sec: 120

  critic:
    provider: codex-cli
    model:
      - gpt-5.3-codex
    temperature: 0.1
    max_tokens: 4096
    timeout_sec: 120

  implementer:
    provider: google
    model:
      - gemini-2.5-pro
    temperature: 0.1
    max_tokens: 65536
    timeout_sec: 1200
