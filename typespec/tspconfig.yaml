emit:
  - "@typespec/openapi3"
  - "@typespec/json-schema"
options:
  "@typespec/openapi3":
    emitter-output-dir: "{project-root}/generated"
    output-file: "openapi.json"
    file-type: "json"
  "@typespec/json-schema":
    emitter-output-dir: "{project-root}/generated/schema"
    file-type: "json"
    int64-strategy: "number"
    seal-object-schemas: true
