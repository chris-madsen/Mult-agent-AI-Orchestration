id: ace-gateway-transport-no-mcp-import
language: TypeScript
rule:
  kind: string_fragment
  regex: '^(?:@modelcontextprotocol/.*|\.\./gateway/mcp-gateway\.js|\./mcp-sdk-stdio\.js)$'
  inside:
    any:
      - kind: import_statement
      - kind: export_statement
    stopBy: end
severity: warning
message: Gateway Projection transport must not import MCP SDK or MCP transport modules.
note: |
  ACE-ARCH-003. Keep model-bound Gateway Projection delivery separate from MCP framing and explicit tools.
  Share only a lower neutral contract when behavior is genuinely common.
metadata:
  contract: ADR-014 / ADR-017 plane separation
  repair: Remove MCP framing dependencies from Gateway Projection transport.
