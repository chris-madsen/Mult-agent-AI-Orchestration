name: Bifröst sole-Gateway / ACE context RPC architecture gate

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'test/**'
      - 'typespec/**'
      - 'integrations/**'
      - 'docs/operations/**'
      - 'openspec/changes/013-gateway-g11-production-acceptance/**'
      - 'package.json'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bifrost-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0.4.0
        with:
          node-version: '22'
      - name: Reject second-Gateway legacy runtime contracts
        run: node scripts/bifrost-single-gateway-audit.mjs
