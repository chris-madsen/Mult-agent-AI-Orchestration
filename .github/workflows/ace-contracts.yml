name: ACE verification (PR focused / nightly full)

on:
  pull_request:
  schedule:
    - cron: "33 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    name: Select affected PR language checks
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      node: ${{ steps.paths.outputs.node }}
      go: ${{ steps.paths.outputs.go }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Classify changed PR paths without running tests
        id: paths
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            printf 'node=true\ngo=true\n' >> "${GITHUB_OUTPUT}"
            echo "[scope] nightly/manual: exhaustive verification"
            exit 0
          fi
          if [[ -z "${PR_BASE_SHA}" || -z "${PR_HEAD_SHA}" ]]; then
            echo "[scope] BLOCKED: missing PR commit identities" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "${PR_BASE_SHA}" "${PR_HEAD_SHA}"
          changed="${RUNNER_TEMP}/ace-changed-pr-paths.nul"
          git diff --name-only --diff-filter=ACDMRT -z "${PR_BASE_SHA}" "${PR_HEAD_SHA}" > "${changed}"
          node=false
          go=false
          count=0
          while IFS= read -r -d '' path; do
            count=$((count + 1))
            echo "[scope] changed path: ${path}"
            case "${path}" in
              integrations/bifrost/ace-connector/*) go=true ;;
              scripts/build-bifrost-ace-plugin.sh|.github/workflows/ace-contracts.yml)
                node=true; go=true ;;
              .github/fixtures/contracts/*) node=true; go=true ;;
              src/*|test/*|scripts/*|architecture/*|contracts/*|package.json|package-lock.json|tsconfig.json|tsconfig.eslint.json|.eslintrc.cjs|knip.json|knip.config.*|benchmarks/fixtures/*)
                node=true ;;
              docs/*|benchmarks/reports/*|AGENTS.md|README.md|LICENSE|.agents/*|.codex/*|.github/workflows/*|.github/fixtures/markdown-links/*)
                ;;
              *)
                # Unknown non-document paths get a bounded Node smoke/affected gate,
                # never an automatic full suite. Do not silently skip new code trees.
                node=true ;;
            esac
          done < "${changed}"
          if (( count == 0 )); then
            echo "[scope] BLOCKED: no changed files between PR base and head" >&2
            exit 1
          fi
          printf 'node=%s\ngo=%s\n' "${node}" "${go}" >> "${GITHUB_OUTPUT}"
          echo "[scope] PR node=${node} go=${go} (full runs nightly)"

  contracts:
    name: Focused TypeScript and contracts
    needs: scope
    if: github.event_name != 'pull_request' || needs.scope.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify native Responses v2 is the sole active contract
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          for retired in \
            typespec/main.tsp \
            src/generated/ace-context/v1/types.gen.ts \
            contracts/ace-gateway/v1/projection-request.schema.json \
            contracts/ace-gateway/v1/projection-decision.schema.json; do
            if [[ -e "${retired}" || -L "${retired}" ]]; then
              echo "[qg5] BLOCKED: retired Gateway projection artifact remains: ${retired}" >&2
              exit 1
            fi
          done
          # Compare retained public contracts at every PR head, including once the
          # retired migration snapshot has disappeared from main.
          node --test test/native-contract-migration.test.mjs
          node scripts/verify-native-contract-migration.mjs
          echo "[qg5] only TypeSpec-native Responses v2 contract remains active"
      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install pinned native Codebase Memory code-intelligence provider
        run: | # zizmor: ignore[adhoc-packages] exact upstream v0.12.1 verifies its binary archive
          npm install --global codebase-memory-mcp@0.12.1
          codebase-memory-mcp --version
      - name: Pin structural Python provider for nightly exhaustive suite
        if: github.event_name != 'pull_request'
        run: |
          python3 -m venv .venv-system
          .venv-system/bin/python -m pip install --disable-pip-version-check tree-sitter==0.26.0 tree-sitter-typescript==0.23.2
      - name: Focused PR typecheck, affected tests, lint and architecture
        if: github.event_name == 'pull_request'
        env:
          ACE_TEST_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm run verify:pr
      - name: Full nightly deterministic TypeScript, architecture, build and property suite
        if: github.event_name != 'pull_request'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: npm run verify:full
      - name: Nightly verify source-clean compiled runtime provenance
        if: github.event_name != 'pull_request'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('dist/runtime-provenance.json', 'utf8'));
          if (manifest.sourceCleanAtBuild !== true
            || !Array.isArray(manifest.dirtyRelevantPaths)
            || manifest.dirtyRelevantPaths.length > 0) {
            console.error('[nightly] BLOCKED: dirty compiled runtime provenance', manifest.dirtyRelevantPaths);
            process.exitCode = 1;
          }
          NODE

  docs-links:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Collect changed Markdown files
        id: markdown
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${PR_BASE_SHA}" "${PR_HEAD_SHA}"
          changed="${RUNNER_TEMP}/lychee-changed-paths.txt"
          inputs="${RUNNER_TEMP}/lychee-changed-markdown.txt"
          nul_paths="${RUNNER_TEMP}/lychee-changed-paths.nul"
          : > "${changed}"
          : > "${inputs}"
          # -z avoids Git's quoted Unicode filenames, which bypassed the old grep.
          git diff --name-only --diff-filter=ACMRT -z "${PR_BASE_SHA}" "${PR_HEAD_SHA}" > "${nul_paths}"
          while IFS= read -r -d '' path; do
            # Lychee --files-from is line-delimited. Fail closed on ambiguous paths.
            if [[ "${path}" == *$'\n'* || "${path}" == *$'\r'* ]]; then
              echo "[docs-links] unsupported newline in changed filename" >&2
              exit 1
            fi
            printf '%s\n' "${path}" >> "${changed}"
            if [[ "${path}" == *.md && "${path}" != .github/fixtures/markdown-links/* ]]; then
              if [[ ! -f "${path}" || -L "${path}" ]]; then
                echo "[docs-links] changed Markdown is missing or a symlink: ${path}" >&2
                exit 1
              fi
              printf '%s\n' "${path}" >> "${inputs}"
            fi
          done < "${nul_paths}"

          if grep -Eq '^\.github/workflows/ace-contracts\.yml$|^\.github/fixtures/markdown-links/' "${changed}"; then
            echo "self_test=true" >> "${GITHUB_OUTPUT}"
          else
            echo "self_test=false" >> "${GITHUB_OUTPUT}"
          fi

          if [[ -s "${inputs}" ]]; then
            echo "has_markdown=true" >> "${GITHUB_OUTPUT}"
            sed 's/^/[docs-links] changed: /' "${inputs}"
          else
            echo "has_markdown=false" >> "${GITHUB_OUTPUT}"
            echo "[docs-links] no changed Markdown files"
          fi

      - name: Negative fixture must be rejected
        if: steps.markdown.outputs.self_test == 'true'
        id: negative
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          token: ""
          args: >-
            --offline
            --include-fragments=anchor-only
            --no-progress
            --root-dir "${{ github.workspace }}"
            ".github/fixtures/markdown-links/broken.md"
          fail: false
          failIfEmpty: true
          jobSummary: false
          output: lychee/negative-fixture.md

      - name: Assert negative fixture failed
        if: steps.markdown.outputs.self_test == 'true'
        shell: bash
        env:
          NEGATIVE_EXIT_CODE: ${{ steps.negative.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [[ "${NEGATIVE_EXIT_CODE}" == "0" ]]; then
            echo "Expected broken Markdown fixture to fail, but Lychee returned success." >&2
            exit 1
          fi
          echo "[docs-links] negative fixture rejected with exit code ${NEGATIVE_EXIT_CODE}"

      - name: Positive fixture must pass
        if: steps.markdown.outputs.self_test == 'true'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          token: ""
          args: >-
            --offline
            --include-fragments=anchor-only
            --no-progress
            --root-dir "${{ github.workspace }}"
            ".github/fixtures/markdown-links/valid.md"
          fail: true
          failIfEmpty: true
          jobSummary: false
          output: lychee/positive-fixture.md

      - name: Offline Markdown link verification
        if: steps.markdown.outputs.has_markdown == 'true'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          token: ""
          args: >-
            --offline
            --include-fragments=anchor-only
            --no-progress
            --root-dir "${{ github.workspace }}"
            --files-from "$RUNNER_TEMP/lychee-changed-markdown.txt"
          fail: true
          failIfEmpty: false
          output: lychee/changed-markdown.md

  bifrost-connector:
    needs: scope
    if: github.event_name != 'pull_request' || needs.scope.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Go 1.23
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Test isolated ACE connector
        working-directory: integrations/bifrost/ace-connector
        env:
          GOWORK: "off"
        run: go test -count=1 ./...
      - name: Vet isolated ACE connector
        working-directory: integrations/bifrost/ace-connector
        env:
          GOWORK: "off"
        run: go vet ./...

  bifrost-plugin-build:
    name: Build pinned Bifröst ACE plugin
    needs: scope
    if: github.event_name != 'pull_request' || needs.scope.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout ACE source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch exact pinned Bifröst source outside ACE checkout
        shell: bash
        env:
          BIFROST_COMMIT: 72f03b4b0d4a93b08e9fc0e5ebfe3447248af2a0
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/bifrost-src"
          mkdir -p "$source_root"
          git -C "$source_root" init
          git -C "$source_root" remote add origin https://github.com/chris-madsen/bifrost.git
          git -C "$source_root" fetch --no-tags --depth=1 origin "$BIFROST_COMMIT"
          git -C "$source_root" checkout --detach FETCH_HEAD
          test "$(git -C "$source_root" rev-parse HEAD)" = "$BIFROST_COMMIT"
      - name: Go 1.27.4
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.4"
          cache: false
      - name: Compile native plugin against pinned upstream
        shell: bash
        env:
          BIFROST_COMMIT: 72f03b4b0d4a93b08e9fc0e5ebfe3447248af2a0
          BIFROST_SOURCE_ROOT: ${{ runner.temp }}/bifrost-src
          OUTPUT: ${{ runner.temp }}/ace-bifrost-context.so
        run: |
          set -euo pipefail
          GO_BIN="$(command -v go)" ./scripts/build-bifrost-ace-plugin.sh
          test -s "$OUTPUT"

  real-qdrant:
    # Real Qdrant service + real FastEmbed model. This is projection/retrieval
    # evidence only; it deliberately does not certify Bifröst or an LLM wire.
    # Keep a single shared cache for the composed projection acceptance.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports:
          - 6333:6333
    env:
      ACE_QDRANT_URL: http://127.0.0.1:6333
      ACE_RETRIEVAL_STRATEGY: dense
      ACE_EMBEDDING_PYTHON: python
      PYTHONDONTWRITEBYTECODE: "1"
      FASTEMBED_CACHE_PATH: /tmp/ace-fastembed-cache
      HF_HOME: /tmp/ace-huggingface-cache
    steps:
      - name: Checkout full clean repository identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Python 3.13 for pinned FastEmbed
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install locked Node and embedding dependencies
        run: |
          npm ci --ignore-scripts
          python -m pip install --disable-pip-version-check -r requirements-embedding-fast.txt
      - name: Verify live Qdrant server
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..45}; do
            if curl --fail --silent "http://127.0.0.1:6333/collections" >/dev/null; then
              echo "[qdrant] service ready on attempt ${attempt}"
              exit 0
            fi
            sleep 2
          done
          echo "BLOCKED: Qdrant live server unavailable" >&2
          exit 1
      - name: Build source-identified production runtime
        run: npm run build
      - name: Run live ACE projection through real Qdrant retrieval provider
        run: |
          set -o pipefail
          mkdir -p /tmp/ace-projection-evidence
          npm run test:real-projection | tee /tmp/ace-projection-evidence/projection.log
      - name: Retain source-linked real projection reports and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ace-real-qdrant-projection-${{ github.run_id }}
          path: /tmp/ace-projection-evidence/
          if-no-files-found: warn
          retention-days: 14

  real-non-ts-lsp:
    # Real rust-analyzer protocol conformance, no fake LSP or fixture server.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install native rust-analyzer component
        run: rustup component add rust-analyzer
      - name: Real non-TypeScript LSP definition/reference/hover/diagnostics
        env:
          ACE_NON_TS_LSP_COMMAND: rust-analyzer
          ACE_NON_TS_LSP_TIMEOUT_MS: "60000"
          ACE_NON_TS_LSP_SETTLE_MS: "8000"
        run: npm run test:real-non-ts-lsp -- /tmp/ace-real-non-ts-lsp.json
      - name: Retain real rust-analyzer and TypeScript routing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ace-real-lsp-${{ github.run_id }}
          path: /tmp/ace-real-non-ts-lsp.json
          if-no-files-found: warn
          retention-days: 14
