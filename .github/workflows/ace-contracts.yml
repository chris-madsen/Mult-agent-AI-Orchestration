name: ACE verification (PR focused / nightly full)

on:
  pull_request:
  schedule:
    - cron: "33 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    name: Select affected PR language checks
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      node: ${{ steps.paths.outputs.node }}
      go: ${{ steps.paths.outputs.go }}
      hermes: ${{ steps.paths.outputs.hermes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Classify changed PR paths without running tests
        id: paths
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            printf 'node=true\ngo=true\nhermes=false\n' >> "${GITHUB_OUTPUT}"
            echo "[scope] nightly/manual: exhaustive verification"
            exit 0
          fi
          if [[ -z "${PR_BASE_SHA}" || -z "${PR_HEAD_SHA}" ]]; then
            echo "[scope] BLOCKED: missing PR commit identities" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "${PR_BASE_SHA}" "${PR_HEAD_SHA}"
          changed="${RUNNER_TEMP}/ace-changed-pr-paths.nul"
          git diff --name-only --diff-filter=ACDMRT -z "${PR_BASE_SHA}" "${PR_HEAD_SHA}" > "${changed}"
          node=false
          go=false
          hermes=false
          count=0
          while IFS= read -r -d '' path; do
            count=$((count + 1))
            echo "[scope] changed path: ${path}"
            case "${path}" in
              integrations/bifrost/ace-connector/*) go=true ;;
              integrations/hermes/ace_context_engine/*) hermes=true ;;
              .github/fixtures/contracts/*) node=true; go=true; hermes=true ;;
              src/*|test/*|scripts/*|architecture/*|contracts/*|package.json|package-lock.json|tsconfig.json|tsconfig.eslint.json|.eslintrc.cjs|knip.json|knip.config.*|benchmarks/fixtures/*)
                node=true ;;
              docs/*|benchmarks/reports/*|AGENTS.md|README.md|LICENSE|.agents/*|.codex/*|.github/workflows/*|.github/fixtures/markdown-links/*)
                ;;
              *)
                # Unknown non-document paths get a bounded Node smoke/affected gate,
                # never an automatic full suite. Do not silently skip new code trees.
                node=true ;;
            esac
          done < "${changed}"
          if (( count == 0 )); then
            echo "[scope] BLOCKED: no changed files between PR base and head" >&2
            exit 1
          fi
          printf 'node=%s\ngo=%s\nhermes=%s\n' "${node}" "${go}" "${hermes}" >> "${GITHUB_OUTPUT}"
          echo "[scope] PR node=${node} go=${go} hermes=${hermes} (full runs nightly)"

  contracts:
    name: Focused TypeScript and contracts
    needs: scope
    if: github.event_name != 'pull_request' || needs.scope.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reject in-place rewrite of accepted public v1 contracts
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          baseline=.github/fixtures/contracts/ace-public-v1-baseline.json
          for contract in \
            contracts/ace-gateway/v1/projection-request.schema.json \
            contracts/ace-gateway/v1/projection-decision.schema.json \
            "${baseline}"; do
            if ! git cat-file -e "${PR_BASE_SHA}:${contract}" 2>/dev/null; then
              echo "[qg5] BLOCKED: accepted v1 file missing at PR base: ${contract}" >&2
              exit 1
            fi
            if [[ ! -f "${contract}" || -L "${contract}" ]] \
              || ! git show "${PR_BASE_SHA}:${contract}" | cmp -s - "${contract}"; then
              echo "[qg5] BLOCKED: accepted v1 contract rewritten in place: ${contract}" >&2
              exit 1
            fi
          done
          echo "[qg5] accepted v1 schemas and baseline unchanged"
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Pin structural Python provider for nightly exhaustive suite
        if: github.event_name != 'pull_request'
        run: |
          python3 -m venv .venv-system
          .venv-system/bin/python -m pip install --disable-pip-version-check tree-sitter==0.26.0 tree-sitter-typescript==0.23.2
      - name: Focused PR typecheck, affected tests, lint and architecture
        if: github.event_name == 'pull_request'
        env:
          ACE_TEST_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm run verify:pr
      - name: Full nightly deterministic TypeScript, Hermes, architecture, build and property suite
        if: github.event_name != 'pull_request'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: npm run verify:full
      - name: Nightly verify source-clean compiled runtime provenance
        if: github.event_name != 'pull_request'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('dist/runtime-provenance.json', 'utf8'));
          if (manifest.sourceCleanAtBuild !== true
            || !Array.isArray(manifest.dirtyRelevantPaths)
            || manifest.dirtyRelevantPaths.length > 0) {
            console.error('[nightly] BLOCKED: dirty compiled runtime provenance', manifest.dirtyRelevantPaths);
            process.exitCode = 1;
          }
          NODE

  hermes-plugin:
    name: Focused Hermes Python contracts
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.hermes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Hermes bridge contract suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B -m unittest discover -s integrations/hermes/ace_context_engine -p 'test_*.py'

  docs-links:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Collect changed Markdown files
        id: markdown
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${PR_BASE_SHA}" "${PR_HEAD_SHA}"
          changed="${RUNNER_TEMP}/lychee-changed-paths.txt"
          inputs="${RUNNER_TEMP}/lychee-changed-markdown.txt"
          nul_paths="${RUNNER_TEMP}/lychee-changed-paths.nul"
          : > "${changed}"
          : > "${inputs}"
          # -z avoids Git's quoted Unicode filenames, which bypassed the old grep.
          git diff --name-only --diff-filter=ACMRT -z "${PR_BASE_SHA}" "${PR_HEAD_SHA}" > "${nul_paths}"
          while IFS= read -r -d '' path; do
            # Lychee --files-from is line-delimited. Fail closed on ambiguous paths.
            if [[ "${path}" == *$'\n'* || "${path}" == *$'\r'* ]]; then
              echo "[docs-links] unsupported newline in changed filename" >&2
              exit 1
            fi
            printf '%s\n' "${path}" >> "${changed}"
            if [[ "${path}" == *.md && "${path}" != .github/fixtures/markdown-links/* ]]; then
              if [[ ! -f "${path}" || -L "${path}" ]]; then
                echo "[docs-links] changed Markdown is missing or a symlink: ${path}" >&2
                exit 1
              fi
              printf '%s\n' "${path}" >> "${inputs}"
            fi
          done < "${nul_paths}"

          if grep -Eq '^\.github/workflows/ace-contracts\.yml$|^\.github/fixtures/markdown-links/' "${changed}"; then
            echo "self_test=true" >> "${GITHUB_OUTPUT}"
          else
            echo "self_test=false" >> "${GITHUB_OUTPUT}"
          fi

          if [[ -s "${inputs}" ]]; then
            echo "has_markdown=true" >> "${GITHUB_OUTPUT}"
            sed 's/^/[docs-links] changed: /' "${inputs}"
          else
            echo "has_markdown=false" >> "${GITHUB_OUTPUT}"
            echo "[docs-links] no changed Markdown files"
          fi

      - name: Negative fixture must be rejected
        if: steps.markdown.outputs.self_test == 'true'
        id: negative
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          token: ""
          args: >-
            --offline
            --include-fragments=anchor-only
            --no-progress
            --root-dir "${{ github.workspace }}"
            ".github/fixtures/markdown-links/broken.md"
          fail: false
          failIfEmpty: true
          jobSummary: false
          output: lychee/negative-fixture.md

      - name: Assert negative fixture failed
        if: steps.markdown.outputs.self_test == 'true'
        shell: bash
        env:
          NEGATIVE_EXIT_CODE: ${{ steps.negative.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [[ "${NEGATIVE_EXIT_CODE}" == "0" ]]; then
            echo "Expected broken Markdown fixture to fail, but Lychee returned success." >&2
            exit 1
          fi
          echo "[docs-links] negative fixture rejected with exit code ${NEGATIVE_EXIT_CODE}"

      - name: Positive fixture must pass
        if: steps.markdown.outputs.self_test == 'true'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          token: ""
          args: >-
            --offline
            --include-fragments=anchor-only
            --no-progress
            --root-dir "${{ github.workspace }}"
            ".github/fixtures/markdown-links/valid.md"
          fail: true
          failIfEmpty: true
          jobSummary: false
          output: lychee/positive-fixture.md

      - name: Offline Markdown link verification
        if: steps.markdown.outputs.has_markdown == 'true'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          token: ""
          args: >-
            --offline
            --include-fragments=anchor-only
            --no-progress
            --root-dir "${{ github.workspace }}"
            --files-from "$RUNNER_TEMP/lychee-changed-markdown.txt"
          fail: true
          failIfEmpty: false
          output: lychee/changed-markdown.md

  bifrost-connector:
    needs: scope
    if: github.event_name != 'pull_request' || needs.scope.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Go 1.23
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Test isolated ACE connector
        working-directory: integrations/bifrost/ace-connector
        env:
          GOWORK: "off"
        run: go test -count=1 ./...
      - name: Vet isolated ACE connector
        working-directory: integrations/bifrost/ace-connector
        env:
          GOWORK: "off"
        run: go vet ./...

  real-qdrant:
    # Real Qdrant service + real FastEmbed model, not mocked provider wires.
    # Keep a single shared cache for the composed provider/crash acceptance.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports:
          - 6333:6333
    env:
      ACE_QDRANT_URL: http://127.0.0.1:6333
      ACE_RETRIEVAL_STRATEGY: dense
      ACE_EMBEDDING_PYTHON: python
      PYTHONDONTWRITEBYTECODE: "1"
      FASTEMBED_CACHE_PATH: /tmp/ace-fastembed-cache
      HF_HOME: /tmp/ace-huggingface-cache
    steps:
      - name: Checkout full clean repository identity
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Python 3.13 for pinned FastEmbed
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install locked Node and embedding dependencies
        run: |
          npm ci --ignore-scripts
          python -m pip install --disable-pip-version-check -r requirements-embedding-fast.txt
      - name: Verify live Qdrant server
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..45}; do
            if curl --fail --silent "http://127.0.0.1:6333/collections" >/dev/null; then
              echo "[qdrant] service ready on attempt ${attempt}"
              exit 0
            fi
            sleep 2
          done
          echo "BLOCKED: Qdrant live server unavailable" >&2
          exit 1
      - name: Build source-identified production runtime
        run: npm run build
      - name: Run actual provider and restart acceptance
        run: |
          set -o pipefail
          mkdir -p /tmp/ace-provider-evidence
          npm run test:real-provider | tee /tmp/ace-provider-evidence/provider.log
          npm run test:real-provider-restart | tee /tmp/ace-provider-evidence/restart.log
      - name: Run real two-writer and crash publication acceptance
        run: |
          npm run test:real-qdrant-concurrency -- --output /tmp/ace-provider-evidence/concurrency.json
          npm run test:real-qdrant-crash -- /tmp/ace-provider-evidence/crash.json
      - name: Retain source-linked real provider reports and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ace-real-qdrant-${{ github.run_id }}
          path: /tmp/ace-provider-evidence/
          if-no-files-found: warn
          retention-days: 14

  real-non-ts-lsp:
    # Real rust-analyzer protocol conformance, no fake LSP or fixture server.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install native rust-analyzer component
        run: rustup component add rust-analyzer
      - name: Real non-TypeScript LSP definition/reference/hover/diagnostics
        env:
          ACE_NON_TS_LSP_COMMAND: rust-analyzer
          ACE_NON_TS_LSP_TIMEOUT_MS: "60000"
          ACE_NON_TS_LSP_SETTLE_MS: "8000"
        run: npm run test:real-non-ts-lsp -- /tmp/ace-real-non-ts-lsp.json
      - name: Retain real rust-analyzer and TypeScript routing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ace-real-lsp-${{ github.run_id }}
          path: /tmp/ace-real-non-ts-lsp.json
          if-no-files-found: warn
          retention-days: 14
