name: ACE typecheck and contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Determine verification scope
        id: scope
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            echo "mode=full" >> "${GITHUB_OUTPUT}"
            echo "[ci-scope] push event: full verification"
            exit 0
          fi
          if [[ -z "${PR_BASE_SHA}" || -z "${PR_HEAD_SHA}" ]] || ! git fetch --no-tags --depth=1 origin "${PR_BASE_SHA}" "${PR_HEAD_SHA}"; then
            echo "mode=full" >> "${GITHUB_OUTPUT}"
            echo "[ci-scope] unable to fetch PR identities: full verification"
            exit 0
          fi
          changed="$(git diff --name-only --diff-filter=ACDMRT "${PR_BASE_SHA}" "${PR_HEAD_SHA}")"
          if [[ -z "${changed}" ]]; then
            echo "mode=full" >> "${GITHUB_OUTPUT}"
            echo "[ci-scope] empty PR diff: full verification"
            exit 0
          fi
          mode=docs
          while IFS= read -r file; do
            case "${file}" in
              docs/*|benchmarks/reports/*|AGENTS.md|README.md|LICENSE)
                ;;
              package.json|package-lock.json|tsconfig.json|tsconfig.eslint.json|.eslintrc.cjs|.github/*|scripts/run-affected-tests.mjs|benchmarks/fixtures/*|infra/*|Makefile)
                mode=full
                ;;
              src/*|test/*|scripts/*)
                [[ "${mode}" == "docs" ]] && mode=affected
                ;;
              *)
                mode=full
                ;;
            esac
          done <<< "${changed}"
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "[ci-scope] mode=${mode}"
          printf '%s\n' "${changed}" | sed 's/^/[ci-scope] changed: /'
      - name: Node 22
        uses: actions/setup-node@v4
        if: steps.scope.outputs.mode != 'docs'
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies once
        if: steps.scope.outputs.mode != 'docs'
        run: npm ci --ignore-scripts
      - name: Embedding artifact and evaluator regressions
        if: steps.scope.outputs.mode != 'docs'
        env:
          # Python imports must not create untracked scripts/__pycache__ files:
          # runtime provenance intentionally fails closed on dirty source trees.
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B -m unittest discover -s scripts -p 'test_embedding_*.py'
      - name: Install pinned structural provider
        if: steps.scope.outputs.mode != 'docs'
        run: |
          python3 -m venv .venv-system
          .venv-system/bin/python -m pip install --disable-pip-version-check tree-sitter==0.26.0 tree-sitter-typescript==0.23.2
      - name: Test-impact selector self-check
        if: steps.scope.outputs.mode != 'docs'
        run: npm run test:impact:self
      - name: Deterministic PR verification
        if: steps.scope.outputs.mode == 'full'
        run: npm run verify:pr
      - name: Affected PR verification
        if: steps.scope.outputs.mode == 'affected'
        env:
          ACE_TEST_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm run verify:pr:affected
      - name: Verify clean compiled-runtime provenance
        if: steps.scope.outputs.mode != 'docs'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('dist/runtime-provenance.json', 'utf8'));
          if (manifest.sourceCleanAtBuild !== true
            || !Array.isArray(manifest.dirtyRelevantPaths)
            || manifest.dirtyRelevantPaths.length > 0) {
            console.error('BLOCKED: compiled runtime provenance is dirty:', manifest.dirtyRelevantPaths);
            process.exitCode = 1;
          }
          NODE
      - name: Documentation/evidence verification
        if: steps.scope.outputs.mode == 'docs'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "${PR_BASE_SHA}" "${PR_HEAD_SHA}"

  bifrost-connector:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: Test isolated ACE connector
        working-directory: integrations/bifrost/ace-connector
        env:
          GOWORK: "off"
        run: go test -count=1 ./...
      - name: Vet isolated ACE connector
        working-directory: integrations/bifrost/ace-connector
        env:
          GOWORK: "off"
        run: go vet ./...

  real-qdrant:
    # Real Qdrant service + real FastEmbed model, not mocked provider wires.
    # Keep a single shared cache for the composed provider/crash acceptance.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports:
          - 6333:6333
    env:
      ACE_QDRANT_URL: http://127.0.0.1:6333
      ACE_RETRIEVAL_STRATEGY: dense
      ACE_EMBEDDING_PYTHON: python
      PYTHONDONTWRITEBYTECODE: "1"
      FASTEMBED_CACHE_PATH: /tmp/ace-fastembed-cache
      HF_HOME: /tmp/ace-huggingface-cache
    steps:
      - name: Checkout full clean repository identity
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Python 3.13 for pinned FastEmbed
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked Node and embedding dependencies
        run: |
          npm ci --ignore-scripts
          python -m pip install --disable-pip-version-check -r requirements-embedding-fast.txt
      - name: Verify live Qdrant server
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..45}; do
            if curl --fail --silent "http://127.0.0.1:6333/collections" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "BLOCKED: Qdrant live server unavailable" >&2
          exit 1
      - name: Build source-identified production runtime
        run: npm run build
      - name: Run actual provider and restart acceptance
        run: |
          set -o pipefail
          mkdir -p /tmp/ace-provider-evidence
          npm run test:real-provider | tee /tmp/ace-provider-evidence/provider.log
          npm run test:real-provider-restart | tee /tmp/ace-provider-evidence/restart.log
      - name: Run real two-writer and crash publication acceptance
        run: |
          npm run test:real-qdrant-concurrency -- --output /tmp/ace-provider-evidence/concurrency.json
          npm run test:real-qdrant-crash -- /tmp/ace-provider-evidence/crash.json
      - name: Retain source-linked real provider reports and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ace-real-qdrant-${{ github.run_id }}
          path: /tmp/ace-provider-evidence/
          if-no-files-found: warn
          retention-days: 14

  real-non-ts-lsp:
    # Real rust-analyzer protocol conformance, no fake LSP or fixture server.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install native rust-analyzer component
        run: rustup component add rust-analyzer
      - name: Real non-TypeScript LSP definition/reference/hover/diagnostics
        env:
          ACE_NON_TS_LSP_COMMAND: rust-analyzer
          ACE_NON_TS_LSP_TIMEOUT_MS: "60000"
          ACE_NON_TS_LSP_SETTLE_MS: "8000"
        run: npm run test:real-non-ts-lsp -- /tmp/ace-real-non-ts-lsp.json
      - name: Retain real rust-analyzer and TypeScript routing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ace-real-lsp-${{ github.run_id }}
          path: /tmp/ace-real-non-ts-lsp.json
          if-no-files-found: warn
          retention-days: 14
