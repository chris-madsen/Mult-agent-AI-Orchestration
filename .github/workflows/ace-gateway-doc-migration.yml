name: Bifröst-only historical docs migration preview

on:
  pull_request:
    paths:
      - 'scripts/gateway-doc-migration.mjs'
      - '.github/workflows/ace-gateway-doc-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        group: [docs, openspec, benchmarks]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0.4.0
        with:
          node-version: '22'
      - name: Preview auditable migration without changing GitHub branch
        run: node scripts/gateway-doc-migration.mjs "${{ matrix.group }}"
