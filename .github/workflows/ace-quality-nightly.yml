name: ACE quality nightly

on:
  pull_request:
    paths:
      - ".github/workflows/ace-quality-nightly.yml"
      - "test/nightly/gateway-projection.property.test.ts"
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway-validation-properties:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Exercise bounded gateway request properties
        run: npx tsx --test test/nightly/gateway-projection.property.test.ts
