name: ACE dependency usage and advisory reports

on:
  workflow_dispatch:
  schedule:
    - cron: "13 3 * * *"

permissions:
  contents: read

jobs:
  knip-report:
    name: Knip non-blocking nightly report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Report unused dependencies, exports, and files
        run: npm run analyze:dependencies

  osv-scheduled-report:
    name: Scheduled OSV report
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: |-
        -r
        ./
      fail-on-vuln: false
      upload-sarif: false
      ref: main
