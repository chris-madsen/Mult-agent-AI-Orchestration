name: ACE dependency usage and advisory reports

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "43 5 * * 1"

permissions:
  contents: read

jobs:
  knip-report:
    name: Knip non-blocking report
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Report unused dependencies, exports, and files
        run: npm run analyze:dependencies

  osv-pull-request-report:
    name: OSV report for pull requests
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: |-
        -r
        ./
      fail-on-vuln: false
      upload-sarif: false

  osv-scheduled-report:
    name: Scheduled OSV report
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: |-
        -r
        ./
      fail-on-vuln: false
      upload-sarif: false
      ref: main
