name: ACE TypeSpec codegen pilot

on:
  pull_request:
    paths:
      - 'typespec/**'
      - '.github/workflows/ace-typespec-codegen.yml'
      - 'docs/plans/2026-11-14-typespec-migration-g02.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install exact TypeSpec toolchain and generate lockfile
        run: npm install --prefix typespec --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install from generated lockfile
        run: npm ci --prefix typespec --ignore-scripts --no-audit --no-fund
      - name: Compile TypeSpec and generate maintained TypeScript SDK
        run: npm --prefix typespec run generate
      - name: Export reproducible toolchain artifacts for the initial pin review
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, readdirSync, statSync } from 'node:fs';
          import { join } from 'node:path';
          const files = ['typespec/package-lock.json'];
          function walk(dir) {
            for (const item of readdirSync(dir)) {
              const path = join(dir, item);
              if (statSync(path).isDirectory()) walk(path);
              else files.push(path);
            }
          }
          walk('typespec/generated');
          for (const path of files) {
            const value = readFileSync(path);
            console.log('ACE_GENERATED_FILE ' + JSON.stringify({ path, base64: value.toString('base64') }));
          }
          console.log('ACE_GENERATED_COMPLETE ' + files.length);
          NODE
