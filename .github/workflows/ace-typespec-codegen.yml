name: ACE native Responses TypeSpec codegen

on:
  pull_request:
    paths:
      - 'typespec/**'
      - 'src/generated/ace-context/**'
      - 'src/transport/context-rpc-http.ts'
      - 'test/typespec-context-*.ts'
      - '.github/workflows/ace-typespec-codegen.yml'
      - 'docs/docs/references/ADR-020-native-responses-only.md'
      - 'openspec/changes/013-gateway-g11-production-acceptance/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0.4.0
        with:
          node-version: '22'
      - name: Install from generated lockfile
        run: npm ci --prefix typespec --ignore-scripts --no-audit --no-fund
      - name: Seed an obsolete generated artifact (negative drift fixture)
        run: |
          mkdir -p typespec/generated
          printf 'obsolete schema' > typespec/generated/__obsolete-schema-fixture.json
      - name: Compile TypeSpec and generate maintained TypeScript SDK
        run: npm --prefix typespec run generate
      - name: Verify the obsolete artifact was removed by generation
        run: test ! -e typespec/generated/__obsolete-schema-fixture.json
      - name: Check generated files and lockfile are immutable under regeneration
        run: |
          git diff --exit-code -- typespec/package-lock.json typespec/generated src/generated/ace-context
          if test -n "$(git ls-files --others --exclude-standard -- typespec/generated src/generated/ace-context)"; then
            echo "Untracked codegen output detected"
            exit 1
          fi
      - name: Prove generated drift is rejected (negative mutation fixture)
        run: |
          cp typespec/generated/openapi.json "$RUNNER_TEMP/openapi.generated.backup.json"
          printf '\n' >> typespec/generated/openapi.json
          if git diff --quiet -- typespec/generated/openapi.json; then
            echo "A mutated generated contract evaded the drift gate"
            exit 1
          fi
          cp "$RUNNER_TEMP/openapi.generated.backup.json" typespec/generated/openapi.json
          git diff --exit-code -- typespec/generated/openapi.json
      - name: Typecheck the generated SDK
        run: npm --prefix typespec run check:sdk
      - name: Verify native Responses v2 contract and generated artifacts
        run: npm --prefix typespec run check:native-responses
      - name: Install locked ACE runtime type dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check exhaustive generated DTO to existing domain type mapping
        run: npm run check:public-contract-types
      - name: Exercise native projection and fail-closed contract tests
        run: ./node_modules/.bin/tsx --test test/context-rpc-http.contracts.test.ts test/responses-projection.contracts.test.ts test/responses-projection-service.contracts.test.ts test/context-rpc-schema.contracts.test.ts test/data-class-policy.contracts.test.ts test/bifrost-plugin.contracts.test.ts
